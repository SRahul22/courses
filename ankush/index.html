<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, Ankush</title>
<meta name="description" content="A hello for Ankush.">
<link rel="canonical" href="https://courses.rahuldevsharma.com/ankush/">
<style>
  :root { --bg: #faf8f4; --fg: #1d1d1f; --muted: #6b6b70; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --fg: #f2f2f4; --muted: #9a9aa2; --accent: #fb923c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 16px; text-align: center;
  }
  h1 { font-size: clamp(2.5rem, 9vw, 5.5rem); margin: 0 0 .3em; letter-spacing: -.02em; }
  h1 span { color: var(--accent); }
  .wave { display: inline-block; animation: wave 2.4s ease-in-out infinite; transform-origin: 70% 70%; }
  @keyframes wave { 0%,60%,100% { transform: rotate(0) } 10%,30% { transform: rotate(14deg) } 20% { transform: rotate(-8deg) } 40% { transform: rotate(-4deg) } 50% { transform: rotate(10deg) } }
  @media (prefers-reduced-motion: reduce) { .wave { animation: none; } }
  p { color: var(--muted); font-size: 1.15rem; margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>Hello, <span>Ankush</span> <span class="wave" aria-hidden="true">👋</span></h1>
    <p>Rahul says hi. Hope you're having a great day!</p>
    <p style="margin-top:2rem;font-size:.95rem"><a href="/">All courses</a></p>
  </main>
</body>
</html>
